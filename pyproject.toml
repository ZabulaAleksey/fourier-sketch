[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourier-sketch"
version = "0.1.0"
description = "Staged toolkit for Fourier representations and epicycle reconstruction of planar curves."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93,<6",
    "pillow>=12.3.0",
    "pyside6>=6.8,<7",
    "scikit-image>=0.26.0,<0.27",
]

[dependency-groups]
dev = [
  "coverage>=7.10",
  "hypothesis>=6.165.10",
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fourier_sketch"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "smoke: minimal package and runtime checks",
  "unit: isolated domain or numerical behavior",
  "property: generative mathematical properties",
  "integration: boundaries between real project components",
  "component: renderer or UI component behavior",
  "e2e: live user-to-result product paths",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["fourier_sketch"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
